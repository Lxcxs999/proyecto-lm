<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jardineria Verdana</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/main.js" defer></script>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyC71ITznT0N23m4aHUWEQOG-997LFPJAj4&libraries=maps,marker" defer></script>
</head>
<body class="home">
    <nav>
        <div class="logo-container">
            <a href="index.html">
                <img src="images/logo_jardineria.png" alt="Jardinería Verdana" class="logo">
            </a>
        </div>

        <div class="nav-links">
            <a href="index.html">Inicio</a>
            <a href="productos.html">Productos</a>
            <a href="enfermeria.html">Enfermería</a>
            <a href="contacto.html">Contacto</a>
        </div>

        <div class="nav-cart">
            <a href="login.html"><img src="images/user.png" alt="Usuario" class="user"></a>
            <img src="images/shopping-bag.png" alt="Carrito" class="cart">
        </div>
    </nav>
    <main>
        <div class="contacto-wrapper">
            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3153.573599184732!2d-3.791324822810297!3d37.77659521205311!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0xd6dd70ed2af04d9%3A0xc83edecb2ba4e0ed!2sIES%20Virgen%20del%20Carmen!5e0!3m2!1ses!2ses!4v1780521891935!5m2!1ses!2ses" 
            width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
            <div class="formulario-contacto">
                <h1>Contáctanos</h1>
                <form class="form-box">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="firstname">Nombre:</label>
                            <input type="text" id="firstname" name="firstname" placeholder="Tu nombre" required>
                        </div>
                        <div class="form-group">
                            <label for="lastname">Apellido:</label>
                            <input type="text" id="lastname" name="lastname" placeholder="Tu apellido" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="email">Email:</label>
                            <input type="email" id="email" name="email" placeholder="tu@email.com" required>
                        </div>
                        <div class="form-group">
                            <label for="phone">Teléfono:</label>
                            <input type="tel" id="phone" name="phone" placeholder="+34 XXX XXX XXX">
                        </div>
                    </div>

                    <div class="form-group full-width">
                        <label for="message">Mensaje:</label>
                        <textarea class="textinput" id="message" name="message" placeholder="Cuéntanos en qué podemos ayudarte..." required></textarea>
                    </div>

                    <button type="submit" class="submit-btn">Enviar</button>
                </form>
            </div>
        </div>
    </main>
    <footer>
        <div class="copy">
            <p>&copy; 2026 Jardinería Verdana. Todos los derechos reservados.</p>
        </div>
        <div class="dictionary">
            <a href="xml/glosario.xml" target="_blank" class="enlace-glosario">Consultar Glosario Botánico</a>
        </div>
    </footer>
</body>
</html>
